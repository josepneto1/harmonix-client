<form [formGroup]="form" (ngSubmit)="save()">
  <h2 mat-dialog-title>Nova senha</h2>

  <mat-dialog-content class="dialog-content">
    <hx-input
      formControlName="password"
      label="Senha"
      type="password"
      [showPasswordToggle]="true"
      [maxLength]="20"
    />
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button
      mat-button
      type="button"
      [disabled]="isLoading"
      (click)="close()"
    >
      Cancelar
    </button>

    <button
      mat-flat-button
      type="submit"
      [disabled]="isLoading || form.invalid"
    >
      Salvar
    </button>
  </mat-dialog-actions>
</form>
