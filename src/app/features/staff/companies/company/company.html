<hx-sheet
  [saveDisabled]="isLoading || form.invalid || form.disabled"
  [actions]="actionsBtn"
  (actionsMenuOpened)="refreshActions()"
  (actionSelected)="onSheetAction($event)"
  (save)="save()"
  (close)="closeSheet()"
>
  <form [formGroup]="form" class="form-container">
    <hx-input
      formControlName="name"
      label="Nome da clínica"
      placeholder="Ex: Clínica Harmonix"
      [maxLength]="100"
    />

    <hx-input
      formControlName="alias"
      label="Alias"
      placeholder="Ex: harmonix"
      [maxLength]="20"
    />

    <hx-date-input
      formControlName="expirationDate"
      label="Data de expiração"
    />
  </form>
</hx-sheet>
