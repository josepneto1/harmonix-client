<hx-page
  [showHeader]="true"
  pageTitle="Clínicas"
  [showSearch]="true"
  (searchChange)="onSearch($event)">
  <div class="buttons-container">
    <hx-button
      label="ADICIONAR"
      icon="add"
      [size]="'small'"
      (clicked)="add()"
      [disabled]="false" />
  </div>

  <div class="customer-container">
    <hx-data-table
      [columns]="columns"
      [data]="companies()"
      [serverSide]="true"
      [total]="total()"
      [pageIndex]="pageIndex"
      [pageSize]="pageSize"
      [activeSort]="activeSort"
      [sortDirection]="sortDirection"
      (sortChange)="onSort($event)"
      (pageChange)="onPage($event)"
      (selectedItem)="openEdit($event)">
    </hx-data-table>
  </div>

  <router-outlet />
</hx-page>
