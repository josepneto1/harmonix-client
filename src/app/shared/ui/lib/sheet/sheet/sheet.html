<article class="sheet">
  <header class="sheet__header">
    <span class="sheet__header-title">{{ sheetTitle }}</span>

    <div class="sheet__header-container-btn">
      @if (actions.length) {
        <hx-action-button
          label="Opcoes"
          icon="more_vert"
          [actions]="actions"
          (actionSelected)="onActionSelected($event)"
          (menuOpened)="onActionsMenuOpened()"
        />
      }
      
      <button
        mat-icon-button
        class="sheet__header-close-btn"
        (click)="onClose()"
      >
        <mat-icon class="sheet__header-icon">close</mat-icon>
      </button>
    </div>
  </header>
  
  <section class="sheet__content">
    <ng-content></ng-content>
  </section>

  <footer class="sheet__footer">
      <hx-button
        label="SALVAR"
        [size]="'small'"
        [disabled]="saveDisabled"
        (clicked)="onSave()"
      />
  </footer>
</article>
