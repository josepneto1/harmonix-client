<div class="table-wrapper mat-elevation-z8">
  <div class="table-scroll">
    <table
      mat-table
      [dataSource]="dataSource"
      matSort
      [matSortActive]="activeSort"
      [matSortDirection]="sortDirection"
      (matSortChange)="onSortChange($event)">
      @for (column of columns; track column.key) {
        <ng-container [matColumnDef]="column.key">
          <th
            mat-header-cell
            *matHeaderCellDef
            mat-sort-header
            [disabled]="!column.sortable"
            [style.width]="column.minWidth"
            [style.min-width]="column.minWidth">
            {{ column.label }}
          </th>

          <td
            mat-cell
            *matCellDef="let row"
            [style.width]="column.minWidth"
            [style.max-width]="column.minWidth"
            [style.font-style]="row?.isActive === false ? 'italic' : 'normal'">
            {{ format(row[column.key], column, row) }}
          </td>
        </ng-container>
      }
      
      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
        [ngClass]="{'inactive-row': row?.isActive === false}"
        (click)="selectedItem.emit(row)"
        class="selected-row">
      </tr>
    </table>
  </div>

  <mat-paginator
    class="paginator"
    [length]="total"
    [pageIndex]="pageIndex"
    [pageSize]="pageSize"
    [pageSizeOptions]="pageSizeOptions"
    showFirstLastButtons
    (page)="onPageChange($event)">
  </mat-paginator>
</div>
